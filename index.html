<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Page.pe - Crea tu página web</title>
    <meta name="description" content="Crea y publica tu propia página web de forma sencilla con Page.pe.">

    <style>
        :root {
            --color-primary: #000000;
            --color-accent: #8B0000;
            --color-text: #ffffff;
            --color-muted: #999999;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: var(--color-primary);
            color: var(--color-text);
        }

        header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #222;
        }

        header strong {
            font-size: 24px;
        }

        main {
            max-width: 900px;
            margin: 0 auto;
            padding: 100px 20px;
            text-align: center;
        }

        h1 {
            font-size: 52px;
            margin: 0 0 20px;
        }

        h1 span {
            color: var(--color-accent);
        }

        p {
            max-width: 600px;
            margin: 0 auto;
            font-size: 20px;
            line-height: 1.6;
            color: var(--color-muted);
        }

        .button {
            display: inline-block;
            margin-top: 35px;
            padding: 15px 28px;
            background: var(--color-accent);
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            border-radius: 6px;
        }

        .button:hover {
            background: #a50000;
        }

        footer {
            padding: 30px;
            text-align: center;
            color: var(--color-muted);
            border-top: 1px solid #222;
        }
    </style>
</head>

<body>

    <header>
        <strong>Page.pe</strong>
    </header>

    <main>
        <h1>Crea tu <span>página web</span></h1>

        <p>
            Una forma sencilla de crear, personalizar
            y publicar páginas web.
        </p>

        <a href="#" class="button">
            Comenzar
        </a>
    </main>

    <footer>
        &copy; 2026 Page.pe
    </footer>

</body>
</html>
